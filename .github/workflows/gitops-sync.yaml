name: GitOps Sync & Image Tag Updater

on:
  workflow_run:
    workflows: ["DevSecOps CI Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  update-gitops-manifests:
    name: Update Helm Values & Trigger ArgoCD Sync
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Application Image Tags in Helm Values
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Updating Helm values image tags to SHA: $SHA"
          python3 -c "
          import re
          with open('k8s/helm-charts/microservices-app/values.yaml', 'r') as f:
              data = f.read()
          data = re.sub(r'(backend:[\s\S]*?tag:\s*\")[^\"]+(\")', r'\g<1>${{ github.event.workflow_run.head_sha }}\g<2>', data)
          data = re.sub(r'(frontend:[\s\S]*?tag:\s*\")[^\"]+(\")', r'\g<1>${{ github.event.workflow_run.head_sha }}\g<2>', data)
          with open('k8s/helm-charts/microservices-app/values.yaml', 'w') as f:
              f.write(data)
          "

      - name: Commit and Push GitOps Changes
        run: |
          git config --global user.name "gitops-bot[bot]"
          git config --global user.email "gitops-bot@users.noreply.github.com"
          git add k8s/helm-charts/microservices-app/values.yaml
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): update image tags to SHA ${{ github.event.workflow_run.head_sha }} [skip ci]"
            git push origin main
            echo "GitOps commit pushed. ArgoCD will automatically detect and sync the cluster."
          else
            echo "No image tag changes to commit."
          fi

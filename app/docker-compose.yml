version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/taskdb
      ENVIRONMENT: local-docker-compose
      APP_VERSION: v1.0.0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend-service

volumes:
  postgres_data:

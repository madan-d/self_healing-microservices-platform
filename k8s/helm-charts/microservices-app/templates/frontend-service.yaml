apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend-service
    {{- include "microservices-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: frontend-service

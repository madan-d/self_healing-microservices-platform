{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres-service
    {{- include "microservices-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      name: postgres
      targetPort: 5432
  selector:
    app: postgres-service
{{- end }}

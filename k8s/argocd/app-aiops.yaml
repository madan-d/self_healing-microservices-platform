apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aiops-platform
spec:
  project: default
  source:
    repoURL: 'https://github.com/devops-portfolio/aiops-k8s-platform.git'
    targetRevision: HEAD
    path: aiops-agent/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

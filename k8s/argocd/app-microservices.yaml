apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aiops-platform
spec:
  project: default
  source:
    repoURL: 'https://github.com/devops-portfolio/aiops-k8s-platform.git'
    targetRevision: HEAD
    path: k8s/helm-charts/microservices-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

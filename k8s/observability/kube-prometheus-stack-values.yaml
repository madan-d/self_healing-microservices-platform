# Helm values for kube-prometheus-stack
defaultRules:
  create: true
  rules:
    alertmanager: true
    k8s: true
    kubeStateMetrics: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'aiops-webhook'
      routes:
        - matchers:
            - severity =~ "critical|warning"
          receiver: 'aiops-webhook'
    receivers:
      - name: 'aiops-webhook'
        webhook_configs:
          - url: 'http://aiops-agent.aiops.svc.cluster.local:8000/webhook/alertmanager'
            send_resolved: true
            http_config: {}

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
